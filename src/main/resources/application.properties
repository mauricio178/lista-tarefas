# ===== Configuração padrão (rodando no seu PC) =====
spring.application.name=lista-tarefas

# No Render a porta vem da variável PORT; no seu PC usa 8080
server.port=${PORT:8080}

# Banco H2 em memória: não precisa instalar nada (os dados somem ao reiniciar)
spring.datasource.url=jdbc:h2:mem:tarefas
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
